name: Publication Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-public-content:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Repository-Inhalte prüfen
        run: python scripts/check_public_content.py
