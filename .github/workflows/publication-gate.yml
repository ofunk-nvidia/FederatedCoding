name: Publication Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-public-content:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Repository-Inhalte prüfen
        run: python scripts/check_public_content.py
